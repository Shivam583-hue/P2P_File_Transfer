[package]
name = "BitTorrent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tracker"
path = "src/bin/tracker.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bincode = "1"
tokio = { version = "1", features = ["full"] }
dashmap = "6.1.0"
indicatif = "0.18.4"
